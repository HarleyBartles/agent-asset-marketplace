interface:
  display_name: Session Buster
  short_description: Produce cross-project GPT session continuity exports when the
    user asks for a session buster, bootstrap, handoff block, continuity summary,
    new-session transfer, or similar. Use across projects to preserve verified state,
    fallback or conversation-derived state, running work, open queues, pending decisions,
    caveats, source/tool availability, and next-session verification instructions.
    Do not use for ordinary summaries, dispatches, or project-specific execution.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

interface:
  display_name: Session Buster Ingress
  short_description: Verify incoming continuity blocks.
  default_prompt: Use /session-buster-ingress when ingest session busters, continuity
    exports, resume packets, package queues, and handoff blocks without laundering
    stale state. use after bootstrap and before acting on continuity fields, especially
    linear/codex worker state, pr-gate claims, github heads, package installs, gpt-native
    skill queues, or legacy dispatch packets. treat suggested_next_session_name as
    navigation metadata only. partitions verified, fallback-only, unavailable, contradicted,
    and blocked claims; extracts the next safe directive without mutating repos, issues,
    packages, or worker state.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

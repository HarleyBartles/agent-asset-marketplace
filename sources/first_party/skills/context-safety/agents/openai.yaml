interface:
  display_name: Context Safety
  short_description: Use when large or context-heavy text writes need bounded composition and atomic replacement.
  default_prompt: Use /context-safety when a text write may exceed the safe threshold or when inline composition itself would risk consuming the remaining context. Estimate line count and byte size before writing, avoid composing the full document inline, use a clean-context worker/subagent or bounded append path for risky writes, validate the completed temp file, and atomically replace the target only after validation.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
dependencies:
  tools: []

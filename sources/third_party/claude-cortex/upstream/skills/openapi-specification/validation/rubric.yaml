version: "1.0.0"
skill_name: openapi-specification
evaluated_date: "2026-06-18"

dimensions:
  structure:
    weight: 25
    description: "Clear OpenAPI document layout and component organization"
    criteria:
      - "OpenAPI version, info, paths, and components are all explicit"
      - "Operation ids are unique and stable"
      - "Path parameters are declared where used"
      - "Responses include descriptions"

  schema_modeling:
    weight: 25
    description: "Reusable schema design and payload modeling"
    criteria:
      - "Reusable schemas live under components"
      - "allOf, oneOf, and references are used consistently"
      - "Examples match the schema"
      - "Request and response shapes are separated when needed"

  validation:
    weight: 30
    description: "Spec correctness and validator friendliness"
    criteria:
      - "The document passes the chosen OpenAPI linter"
      - "Missing response descriptions are treated as blockers"
      - "Unused or ambiguous components are removed"
      - "Security schemes are valid for the declared flow"

  usefulness:
    weight: 20
    description: "Practical contract expression for downstream tools"
    criteria:
      - "The spec supports docs generation"
      - "The spec supports client generation"
      - "The spec supports contract tests or mocks"
      - "The document stays readable for maintainers"

passing_criteria:
  minimum_score: 3.5
  target_score: 4.0
  exceptional_score: 4.5
  required_dimensions:
    - validation
  blocking_issues:
    - "Missing or duplicate operationId values"
    - "Responses without descriptions"
    - "Invalid path parameter coverage"
    - "Broken security scheme declarations"

scoring_guide:
  structure:
    "1": "Unreadable or incomplete OpenAPI document"
    "2": "Basic shape exists but major sections are missing"
    "3": "Usable document with minor structure gaps"
    "4": "Well-formed OpenAPI document with clear layout"
    "5": "Highly polished, unambiguous, and validator-friendly"

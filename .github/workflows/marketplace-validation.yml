name: Marketplace validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-validation:
    name: marketplace-validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint changed Python files
        shell: bash
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep '\.py$' || true)
          else
            mapfile -t files < <(git ls-files '*.py')
          fi
          if [ ${#files[@]} -gt 0 ]; then
            python -m ruff check "${files[@]}"
          fi

      - name: Repo standards
        run: bash .agents/skills/repo-standards/scripts/repo-standards.sh --check

      - name: Validate agent mesh
        run: bash .agents/skills/generating-agent-mesh/scripts/validate-agent-mesh.sh --check

      - name: Marketplace inventory
        run: python tools/rebuild_marketplace.py --phase inventory --check

      - name: Heal overlays
        run: python tools/rebuild_marketplace.py --phase heal --check

      - name: Marketplace project
        run: python tools/rebuild_marketplace.py --phase project --check

      - name: Marketplace index
        run: python tools/rebuild_marketplace.py --phase index --check

      - name: Marketplace catalog
        run: python tools/rebuild_marketplace.py --phase catalog --check

      - name: Final validation
        run: python tools/rebuild_marketplace.py --phase validate --check

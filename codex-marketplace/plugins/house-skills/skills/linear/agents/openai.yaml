  short_description: Safely use Linear as an issue and planning control surface.
  default_prompt: 'Use /linear when use for linear connector mechanics: reading, creating,
    updating, commenting, and organizing linear issues, projects, documents, labels,
    and statuses. use when the user asks to inspect or mutate linear objects, capture
    side notes durably, create planning issues/projects, or recover from linear connector
    quirks. do not use as the coding dispatch control plane: linear/codex worker routing,
    codex status checks, pr-gate handling, and dispatch decisions belong to linear-issue-shaping;
    github proof belongs to the repo/github proof surface.'
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

interface:
  display_name: Adventures Storyboard Preflight
  short_description: Storyboard and diagram planning before complex Adventures image
    generation.
  default_prompt: Use /adventures-storyboard-preflight when prepare gpt/project-side
    adventures storyboards, prompt boards, and deterministic visual planning. use
    when harley asks ordinary gpt to storyboard frames, make prompt boards, map slide
    visuals, preflight story beats, or produce visual planning packets before image
    generation; never grants image-generation authority.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

interface:
  display_name: Codex Repo Receipts
  short_description: Publish durable repo-resident plan and implementation-record receipts.
  default_prompt: Use /codex-repo-receipts for non-trivial repo-backed work so the worker publishes a plan under the repository's local convention, or docs/superpowers/plans/ by default, plus a matching implementation record under the repository's local convention, or docs/superpowers/records/ by default. Link both artifacts in the PR body or final worker report. Omit receipts only for tiny mechanical changes, and only when the omission is explicit and justified.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

version: "1.0.0"
skill_name: threat-modeling-techniques
evaluated_date: "2026-06-18"

dimensions:
  scope_and_boundaries:
    weight: 20
    description: "Clear definition of the system, trust boundaries, and attack surface"
    criteria:
      - "The analysis names in-scope components"
      - "Trust boundaries are explicit"
      - "Assumptions and out-of-scope items are recorded"

  threat_identification:
    weight: 25
    description: "Coverage of STRIDE, attack trees, and abuse-case thinking"
    criteria:
      - "STRIDE is applied to the relevant components"
      - "Attack trees cover the high-value paths"
      - "Threat scenarios are concrete and actionable"

  risk_assessment:
    weight: 20
    description: "Severity and likelihood are scored consistently"
    criteria:
      - "Risks are ranked with a clear rubric"
      - "The scoring rationale is documented"
      - "The most important risks are obvious"

  mitigation_quality:
    weight: 20
    description: "Controls reduce risk and are feasible to implement"
    criteria:
      - "Mitigations map to the threat"
      - "Controls are testable or reviewable"
      - "Residual risk is explicitly stated when accepted"

  validation_and_follow_through:
    weight: 15
    description: "The model is kept current and validated after decisions"
    criteria:
      - "Security requirements are recorded"
      - "The model can be revisited when the design changes"
      - "Validation steps are named"

passing_criteria:
  minimum_score: 3.5
  target_score: 4.0
  exceptional_score: 4.5
  required_dimensions:
    - scope_and_boundaries
    - threat_identification
    - mitigation_quality
  blocking_issues:
    - "No trust boundaries identified"
    - "No threat scenarios captured"
    - "Mitigations are missing or not tied to threats"
    - "Residual risk is accepted without documentation"


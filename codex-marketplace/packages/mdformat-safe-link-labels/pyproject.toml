[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdformat-safe-link-labels"
version = "1.0.0"
description = "Preserve safe literal underscores in plain Markdown link labels"
requires-python = ">=3.10"
dependencies = ["mdformat==1.0.0"]

[project.entry-points."mdformat.parser_extension"]
safe-link-labels = "mdformat_safe_link_labels"

[tool.setuptools]
py-modules = ["mdformat_safe_link_labels"]
package-dir = {"" = "src"}

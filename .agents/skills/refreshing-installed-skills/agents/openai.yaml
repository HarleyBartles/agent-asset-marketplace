version: 1
metadata:
  skill_name: refreshing-installed-skills
  source_category: first_party
interface:
  display_name: Refreshing Installed Skills
  short_description: Refresh installed skills and preserve source provenance.
  default_prompt: Use refreshing-installed-skills when a repository that deliberately configures marketplace skills needs its projections refreshed. The utility installs skills from INSTALLED_BY_DEFAULT plugins, can roll the optional marketplace-source submodule, and runs an optional scripts/validate_local_skills_extra hook for repo-specific local-skill policy.
policy:
  allow_implicit_invocation: false
